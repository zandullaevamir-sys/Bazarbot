<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>Random Joke Generator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="joke-card" aria-labelledby="page-title">
      <div class="badge">😂 Daily Laugh</div>
      <h1 id="page-title">Random Joke Generator</h1>
      <p class="subtitle">Need a quick laugh? Get a fresh joke from the internet.</p>

      <div id="joke" class="joke-box" aria-live="polite">
        <p class="loading">Click the button to load a joke.</p>
      </div>

      <div class="actions">
        <button id="new-joke" class="primary-button" type="button">
          <span aria-hidden="true">🎲</span>
          Tell me a joke
        </button>
        <button id="copy-joke" class="secondary-button" type="button" disabled>
          <span aria-hidden="true">📋</span>
          Copy
        </button>
      </div>

      <p id="status" class="status" role="status"></p>
      <p class="source">Powered by <a href="https://jokeapi.dev/" target="_blank" rel="noreferrer">JokeAPI</a></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
